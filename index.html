<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple PWA that fetches random dog pictures." />
  <meta name="theme-color" content="#007bff" />

  <!-- PWA manifest link -->
  <link rel="manifest" href="manifest.json" />

  <!-- Fallback icon for iOS (Apple doesn't read manifest icons) -->
  <link rel="apple-touch-icon" href="icon-512.png" />

  <title>DogSnap PWA</title>

  <style>
    /* ── Reset & base ──────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: linear-gradient(135deg, #e8f4ff 0%, #f0f4ff 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a1a2e;
      padding: 1.5rem;
    }

    /* ── Header ────────────────────────────────────────── */
    header {
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #007bff;
    }

    header p {
      margin-top: 0.35rem;
      font-size: 0.95rem;
      color: #555;
    }

    /* ── Card ──────────────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.06),
        0 12px 40px rgba(0, 123, 255, 0.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 6px 10px rgba(0, 0, 0, 0.08),
        0 20px 50px rgba(0, 123, 255, 0.18);
    }

    /* ── Image area ────────────────────────────────────── */
    .card__image-wrap {
      position: relative;
      width: 100%;
      /* 4:3 aspect ratio placeholder */
      aspect-ratio: 4 / 3;
      background: #e8f0fe;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card__image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease;
    }

    /* Fade-in when image loads */
    .card__image-wrap img.loading {
      opacity: 0;
    }

    /* Spinner shown while fetching */
    .spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4px solid #d0e4ff;
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner.hidden {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Card body ─────────────────────────────────────── */
    .card__body {
      padding: 1.4rem 1.6rem 1.6rem;
    }

    .card__badge {
      display: inline-block;
      background: #e8f4ff;
      color: #007bff;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 99px;
      margin-bottom: 0.7rem;
    }

    .card__title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      color: #1a1a2e;
      min-height: 1.5rem; /* prevents layout jump */
    }

    .card__meta {
      margin-top: 0.4rem;
      font-size: 0.82rem;
      color: #888;
    }

    /* ── Fetch button ──────────────────────────────────── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.1rem;
      width: 100%;
      padding: 0.75rem 1rem;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:hover  { background: #0069d9; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled {
      background: #a8d1ff;
      cursor: not-allowed;
    }

    /* ── Error banner ──────────────────────────────────── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: #fff3f3;
      color: #c0392b;
      border: 1px solid #fcd0d0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
      margin-top: 0.8rem;
    }

    .error-msg.visible { display: flex; }

    /* ── Offline notice ────────────────────────────────── */
    .offline-pill {
      display: none;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
      border-radius: 99px;
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .offline-pill.visible { display: inline-block; }

    /* ── Footer ────────────────────────────────────────── */
    footer {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
    }

    footer a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐶 DogSnap</h1>
    <p>A random dog photo, every tap.</p>
  </header>

  <!-- Offline indicator (shown by JS when navigator.onLine === false) -->
  <span class="offline-pill" id="offlinePill" role="status">📶 Offline mode</span>

  <!-- Main card -->
  <article class="card" aria-label="Random dog photo card">
    <div class="card__image-wrap">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <img
        id="dogImage"
        class="loading"
        src=""
        alt="A random dog"
        role="img"
      />
    </div>

    <div class="card__body">
      <span class="card__badge">Random Dog</span>
      <p class="card__title" id="breedLabel">Fetching a new friend…</p>
      <p class="card__meta" id="sourceMeta"></p>

      <button class="btn" id="fetchBtn" aria-label="Fetch another dog image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
        </svg>
        New Dog
      </button>

      <!-- Inline error message -->
      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite">
        ⚠️ <span id="errorText">Could not fetch a dog. Check your connection.</span>
      </div>
    </div>
  </article>

  <footer>
    Powered by the <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener">Dog CEO API</a>
    &nbsp;·&nbsp; Open-source &amp; ad-free
  </footer>

  <script>
    /* ───────────────────────────────────────────────────
       Service Worker registration
    ─────────────────────────────────────────────────── */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(reg => console.log('[SW] Registered, scope:', reg.scope))
          .catch(err => console.error('[SW] Registration failed:', err));
      });
    }

    /* ───────────────────────────────────────────────────
       DOM references
    ─────────────────────────────────────────────────── */
    const dogImage    = document.getElementById('dogImage');
    const breedLabel  = document.getElementById('breedLabel');
    const sourceMeta  = document.getElementById('sourceMeta');
    const fetchBtn    = document.getElementById('fetchBtn');
    const spinner     = document.getElementById('spinner');
    const errorMsg    = document.getElementById('errorMsg');
    const errorText   = document.getElementById('errorText');
    const offlinePill = document.getElementById('offlinePill');

    /* ───────────────────────────────────────────────────
       Offline / online detection
    ─────────────────────────────────────────────────── */
    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlinePill.classList.add('visible');
        fetchBtn.disabled = true;
        fetchBtn.title = 'No internet connection';
      } else {
        offlinePill.classList.remove('visible');
        fetchBtn.disabled = false;
        fetchBtn.title = '';
      }
    }

    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus(); // run once on load

    /* ───────────────────────────────────────────────────
       Helper: extract breed name from Dog CEO image URL
       URL format: .../breeds/<breed>/<optional-sub>/image.jpg
    ─────────────────────────────────────────────────── */
    function extractBreed(url) {
      try {
        const parts = new URL(url).pathname.split('/');
        const breedsIdx = parts.indexOf('breeds');
        if (breedsIdx === -1) return 'Unknown breed';

        const main = parts[breedsIdx + 1] ?? '';
        const sub  = parts[breedsIdx + 2] ?? '';

        // sub-breed directories are named things like "bulldog" not image filenames
        const isSubBreed = sub && !sub.includes('.');
        const breed = isSubBreed
          ? `${capitalise(sub)} ${capitalise(main)}`
          : capitalise(main);

        return breed || 'Unknown breed';
      } catch {
        return 'Unknown breed';
      }
    }

    function capitalise(str) {
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    /* ───────────────────────────────────────────────────
       Core: fetch a random dog image from Dog CEO API
       Endpoint: https://dog.ceo/api/breeds/image/random
       Returns JSON: { message: "<image_url>", status: "success" }
    ─────────────────────────────────────────────────── */
    async function fetchDog() {
      // UI: loading state
      fetchBtn.disabled = true;
      spinner.classList.remove('hidden');
      dogImage.classList.add('loading');
      errorMsg.classList.remove('visible');
      breedLabel.textContent = 'Fetching a new friend…';
      sourceMeta.textContent = '';

      try {
        const response = await fetch('https://dog.ceo/api/breeds/image/random');

        if (!response.ok) {
          throw new Error(`API responded with status ${response.status}`);
        }

        const data = await response.json();

        if (data.status !== 'success' || !data.message) {
          throw new Error('Unexpected API response format.');
        }

        /* Load the image; wait for it before showing */
        await loadImage(dogImage, data.message);

        breedLabel.textContent = extractBreed(data.message);
        sourceMeta.textContent = 'Source: dog.ceo/dog-api';

      } catch (err) {
        console.error('[fetchDog]', err);
        errorText.textContent = 'Could not fetch a dog. Check your connection and try again.';
        errorMsg.classList.add('visible');
        breedLabel.textContent = 'Something went wrong.';
      } finally {
        // UI: restore
        spinner.classList.add('hidden');
        if (navigator.onLine) fetchBtn.disabled = false;
      }
    }

    /* ───────────────────────────────────────────────────
       Helper: Promise-wrapped image loader for smooth
       fade-in transition and proper error handling.
    ─────────────────────────────────────────────────── */
    function loadImage(imgEl, src) {
      return new Promise((resolve, reject) => {
        imgEl.onload  = () => { imgEl.classList.remove('loading'); resolve(); };
        imgEl.onerror = () => reject(new Error('Image failed to load.'));
        imgEl.src = src;
      });
    }

    /* ───────────────────────────────────────────────────
       Event binding
    ─────────────────────────────────────────────────── */
    fetchBtn.addEventListener('click', fetchDog);

    /* Auto-fetch on page load */
    fetchDog();
  </script>

</body>
</html>
